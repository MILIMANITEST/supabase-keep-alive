name: Keep Supabase Alive

on:
  schedule:
    # Runs automatically every Monday and Thursday at 00:00 UTC
    - cron: '0 0 * * 1,4'
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send ping query to Supabase
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/mps_learners?select=count" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
          
